name: Test Bun Support

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]

jobs:
  test-bun:
    name: Test with Bun
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 📥
        uses: actions/checkout@v4

      - name: Setup Bun 🥟
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Test Bun functionality 🧪
        run: |
          echo "Testing Bun installation..."
          bun --version
          echo "Bun is ready for use!"

      - name: Deploy to Vercel with Bun 🚀
        uses: ./
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PACKAGE_MANAGER: 'bun'
          PRODUCTION: false
          CREATE_COMMENT: false
          GITHUB_DEPLOYMENT: false
